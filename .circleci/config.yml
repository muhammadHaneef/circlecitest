version: 2.1
jobs:
  test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - restore_cache:
          key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}
      - run:
          name: Install dependencies
          command: |
            apt install python3.10-venv
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - save_cache:
          key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}
          paths:
            - "venv"
      - run:
          name: Running tests
          command: |
            . venv/bin/activate
            python3 tests.py
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/
          destination: python_app

workflows:
  run-tests:
    jobs:
      - test